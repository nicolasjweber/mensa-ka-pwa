name: Update Screenshots

on:
  push:
    branches:
      - main
      - master
    paths:
      - "web/**"
      - "scripts/update-screenshot.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate screenshots
        run: node scripts/update-screenshot.mjs

      - name: Commit updated screenshots
        run: |
          if ! git diff --quiet assets/screenshot*.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/screenshot.png assets/screenshot-dark.png
            git commit -m "docs: update README screenshots [skip ci]"
            git push
          fi
