  <body>
    <header class="header">
      <div class="hero">
        <h1>Mensa Karlsruhe</h1>
        <p class="subtitle">Implements api.mensa-ka.de as a Progressive Web App</p>
      </div>
      <div class="header-actions">
        <button id="refreshButton" class="header-btn" type="button" aria-label="Refresh meal plan from server" title="Refresh">
          <span id="refreshIcon" class="refresh-icon" aria-hidden="true">&#x21bb;</span>
          <span class="btn-text">Refresh</span>
        </button>
        <button id="installButton" class="install-button" hidden="">Install App</button>
      </div>
    </header>
    <main class="main">
      <section class="controls-card">
        <div class="selectors-row">
          <div class="control-field canteen-field">
            <label for="canteenSelect">Canteen</label>
            <div class="select-wrapper">
              <select id="canteenSelect"></select>
            </div>
          </div>
          <div class="control-field price-field">
            <label for="priceModeSelect">Price category</label>
            <div class="select-wrapper">
              <select id="priceModeSelect">
                <option value="student" selected="">Student</option>
                <option value="employee">Employee</option>
                <option value="pupil">Pupil</option>
                <option value="guest">Guest</option>
              </select>
            </div>
          </div>
          <div class="control-field filters-field">
            <label>Filters</label>
            <div class="filter-chips" role="group" aria-label="Dietary and preference filters">
              <button id="chipVegan" class="filter-chip" type="button" data-filter="vegan" aria-pressed="false">🌱 Vegan</button>
              <button id="chipVegetarian" class="filter-chip" type="button" data-filter="vegetarian" aria-pressed="false">🧀 Vegetarian</button>
              <button id="chipNoPork" class="filter-chip" type="button" data-filter="noPork" aria-pressed="false">🚫 No Pork</button>
              <button id="chipFavorites" class="filter-chip" type="button" data-filter="favoritesOnly" aria-pressed="false">❤️ Favorites</button>
              <span id="summaryMessage" class="summary-badge" aria-live="polite"></span>
            </div>
          </div>
        </div>

        <div class="week-strip-container">
          <div class="week-strip-header">
            <div class="week-strip-header-left">
              <button id="calendarToggleBtn" class="calendar-toggle-btn" type="button" aria-expanded="false" title="Toggle month calendar view" aria-label="Toggle month calendar view">
                <span class="cal-icon" aria-hidden="true">&#x1F4C5;</span>
                <span id="calendarToggleText" class="cal-toggle-text">Month</span>
              </button>
            </div>
            <div class="week-strip-nav">
              <button id="prevDayButton" class="nav-arrow-btn" type="button" aria-label="Previous day (A or Left Arrow)">&#10094;</button>
              <span id="dateDisplay" class="week-title" aria-live="polite"></span>
              <button id="nextDayButton" class="nav-arrow-btn" type="button" aria-label="Next day (D or Right Arrow)">&#10095;</button>
            </div>
            <div class="week-strip-header-right">
              <button id="todayButton" class="today-pill-btn" type="button">Today</button>
            </div>
          </div>
          <div id="weekDaysStrip" class="week-days-strip" role="tablist" aria-label="Select day of the week">
            <!-- Day tabs (Mon-Fri) rendered by JavaScript -->
          </div>

          <div id="monthCalendar" class="month-calendar" hidden="">
            <div class="month-header-bar">
              <button id="monthPrevBtn" class="nav-arrow-btn" type="button" aria-label="Previous month">&#10094;</button>
              <span id="monthLabel" class="month-title" aria-live="polite"></span>
              <button id="monthNextBtn" class="nav-arrow-btn" type="button" aria-label="Next month">&#10095;</button>
            </div>
            <div class="month-weekdays-header" aria-hidden="true">
              <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
            </div>
            <div id="monthDaysGrid" class="month-days-grid" role="grid" aria-label="Month calendar days">
              <!-- Rendered by JavaScript -->
            </div>
          </div>
        </div>
      </section>
      <section class="meta">
        <p id="statusMessage" class="status" role="status" aria-live="polite"></p>
      </section>
      <section id="mealPlanContainer" class="meal-plan" aria-live="polite"></section>
    </main>
    <footer class="footer">
      <a id="githubLink" href="https://github.com/nicolasjweber/mensa-ka-pwa" target="_blank" rel="noopener noreferrer">
        View on GitHub
      </a>
    </footer>
    <dialog id="imageModal" class="lightbox-dialog" aria-label="Meal photo viewer">
      <div class="lb-header">
        <div class="lb-title-wrap">
          <span id="imageModalCaption" class="lb-title"></span>
          <span id="imageModalCounter" class="lb-counter"></span>
        </div>
        <button id="imageModalClose" class="lb-btn lb-close" type="button" aria-label="Close photo viewer">&times;</button>
      </div>
      <div class="lb-body">
        <button id="imageModalPrev" class="lb-nav-btn lb-prev" type="button" aria-label="Previous photo">&#10094;</button>
        <div id="imageModalViewport" class="lb-img-container">
          <div id="imageModalSpinner" class="lb-spinner" aria-hidden="true"></div>
          <img id="imageModalContent" class="lb-img" alt="Meal photo" draggable="false">
        </div>
        <button id="imageModalNext" class="lb-nav-btn lb-next" type="button" aria-label="Next photo">&#10095;</button>
      </div>
      <div class="lb-footer">
        <div id="imageModalDots" class="lb-dots" role="tablist" aria-label="Photo pagination"></div>
      </div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
